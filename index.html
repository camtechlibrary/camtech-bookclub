<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamTech Book Club - Member RSVP</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --camtech-navy: #183B70;
            --camtech-navy-hover: #234E8C;
            --camtech-light-blue: #EBF2FA; 
            --camtech-accent-blue: #C0D6F0;
            --bg-sand: #F5F1EA;
            --card-bg: #FFFFFF;
            --text-dark: #2C3E50;
            --text-muted: #70685C;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--bg-sand); 
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid #EAE3D9;
            overflow: hidden;
        }

        .brand-header {
            background: var(--camtech-navy);
            color: #FFFFFF;
            padding: 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            height: 40px;
            width: auto;
            object-fit: contain;
            background: #FFFFFF;
            padding: 4px 10px;
            border-radius: 8px;
        }

        .brand-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--camtech-accent-blue);
            text-transform: uppercase;
        }

        .page-heading {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            color: #FFFFFF;
        }

        .form-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #DCD4C8;
            font-size: 13px;
            color: var(--text-dark);
            outline: none;
            background: #FAF7F2;
            transition: border-color 0.2s ease;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--camtech-navy);
            background: #FFFFFF;
        }

        .session-info-card {
            background: var(--camtech-light-blue);
            border: 1px solid var(--camtech-accent-blue);
            border-radius: 12px;
            padding: 14px;
        }

        .session-book-title {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--camtech-navy);
            margin-bottom: 2px;
        }

        .session-book-author {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .session-meta-row {
            font-size: 12px;
            color: var(--camtech-navy);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            font-weight: 500;
        }

        .vote-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-vote {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s ease, background 0.2s ease;
        }

        .btn-vote:active { transform: scale(0.98); }
        .btn-attend { background: var(--camtech-navy); color: #FFFFFF; }
        .btn-attend:hover { background: var(--camtech-navy-hover); }
        .btn-cant { background: #FFEBEE; color: #C62828; border: 1px solid #FFCDD2; }
        .btn-cant:hover { background: #FFCDD2; }
        .btn-unsure { background: #FFFDE7; color: #F57F17; border: 1px solid #FFF59D; }
        .btn-unsure:hover { background: #FFF59D; }

        .conditional-box {
            display: none;
            flex-direction: column;
            gap: 10px;
            background: #FAF7F2;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #EAE3D9;
        }

        .status-msg {
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
            display: none;
            font-weight: 600;
        }
        .status-success { background: #E8F5E9; color: #2E7D32; border: 1px solid #A5D6A7; }
        .status-error { background: #FFEBEE; color: #C62828; border: 1px solid #FFCDD2; }

        .footer-credit { text-align: center; font-size: 11px; color: var(--text-muted); padding: 12px 20px 16px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="brand-header">
            <img src="camtech_logo.png" alt="CamTech Logo" class="header-logo" onerror="this.style.display='none'">
            <div class="brand-title">CamTech Library Book Club</div>
            <div class="page-heading">Weekly Reading & Discussion</div>
        </div>

        <div class="form-content">
            <div class="form-group">
                <label class="form-label" for="userName">Your Full Name</label>
                <input type="text" id="userName" class="form-input" placeholder="e.g. Sokha Chan" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="sessionSelect">Select Session</label>
                <select id="sessionSelect" class="form-select" onchange="onSessionSelectChange()"></select>
            </div>

            <div class="session-info-card">
                <div class="session-book-title" id="bookTitle">Loading book details...</div>
                <div class="session-book-author" id="bookAuthor">...</div>
                <div class="session-meta-row">🕒 <span id="sessionTime">3:30 PM - 5:00 PM</span></div>
                <div class="session-meta-row">📍 <span id="sessionLocation">CamTech University, lobby</span></div>
            </div>

            <div class="conditional-box" id="feedbackBox">
                <label class="form-label">Optional Feedback / Rating</label>
                <select id="userRating" class="form-select">
                    <option value="">Rate past session (Optional)</option>
                    <option value="5 ⭐">5 ⭐ - Excellent</option>
                    <option value="4 ⭐">4 ⭐ - Very Good</option>
                    <option value="3 ⭐">3 ⭐ - Good</option>
                    <option value="2 ⭐">2 ⭐ - Average</option>
                    <option value="1 ⭐">1 ⭐ - Needs Improvement</option>
                </select>
                <input type="text" id="userComment" class="form-input" placeholder="Comments or book recommendations...">
            </div>

            <label class="form-label">Will you join us?</label>
            
            <div class="vote-options">
                <button type="button" class="btn-vote btn-attend" onclick="submitResponse('I\'ll Attend')">
                    ✅ I'll Attend
                </button>
                <button type="button" class="btn-vote btn-cant" onclick="toggleCantReasonBox()">
                    ❌ Can't Attend
                </button>
                <button type="button" class="btn-vote btn-unsure" onclick="submitResponse('Not Sure Yet')">
                    🤔 Not Sure Yet
                </button>
            </div>

            <div class="conditional-box" id="cantReasonBox">
                <label class="form-label" for="cantReason">Reason for missing session:</label>
                <input type="text" id="cantReason" class="form-input" placeholder="e.g. Class conflict, exam...">
                <button type="button" class="btn-vote btn-cant" onclick="submitResponse('Can\'t Attend')">
                    Confirm Submission
                </button>
            </div>

            <div id="statusAlert" class="status-msg"></div>
        </div>

        <div class="footer-credit">
            CamTech University • Library Services Console
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2nvLYa1kNGijsg_XEqfW1lSdtsTUnOfBDrTkjL6GbyDsmPgKF2dI40rVu9ujQ9Xym/exec";
        let sessionDetailsMap = {};
        let activeSessionName = "";
        let activeSessionNeedsSetup = false;

        window.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    const u = tg.initDataUnsafe.user;
                    const fullName = `${u.first_name || ''} ${u.last_name || ''}`.trim();
                    if (fullName) document.getElementById('userName').value = fullName;
                }
            }
            fetchSessionMetadata();
        });

        async function fetchSessionMetadata() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getDetails`);
                const data = await res.json();
                
                sessionDetailsMap = data.details || {};
                activeSessionName = data.activeSession || Object.keys(sessionDetailsMap)[0] || "Session 11";
                activeSessionNeedsSetup = !!data.activeNeedsSetup;

                const select = document.getElementById('sessionSelect');
                select.innerHTML = '';
                
                const availableSessions = Object.keys(sessionDetailsMap);
                if (!availableSessions.includes(activeSessionName)) {
                    availableSessions.push(activeSessionName);
                }

                availableSessions.sort().reverse().forEach(sess => {
                    const opt = document.createElement('option');
                    opt.value = sess;
                    opt.innerText = sess === activeSessionName ? `${sess} (Current Active)` : sess;
                    select.appendChild(opt);
                });

                select.value = activeSessionName;
                onSessionSelectChange();
            } catch (err) {
                console.error("Backend fetch error:", err);
                onSessionSelectChange();
            }
        }

        function onSessionSelectChange() {
            const selected = document.getElementById('sessionSelect').value;
            const details = sessionDetailsMap[selected];

            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.style.display = (selected !== activeSessionName) ? 'flex' : 'none';

            const needsSetup = selected === activeSessionName && activeSessionNeedsSetup;

            if (needsSetup) {
                document.getElementById('bookTitle').innerText = "Book pick coming soon";
                document.getElementById('bookAuthor').innerText = "The librarian hasn't added this week's book yet — check back soon!";
                document.getElementById('sessionTime').innerText = (details && details.time) || "3:30 PM - 5:00 PM";
                document.getElementById('sessionLocation').innerText = (details && details.location) || "CamTech University, lobby";
            } else if (details) {
                document.getElementById('bookTitle').innerText = details.title || "No Title Set";
                document.getElementById('bookAuthor').innerText = details.author || "";
                document.getElementById('sessionTime').innerText = details.time || "3:30 PM - 5:00 PM";
                document.getElementById('sessionLocation').innerText = details.location || "CamTech University, lobby";
            } else {
                document.getElementById('bookTitle').innerText = "No Title Set";
                document.getElementById('bookAuthor').innerText = "";
            }
        }

        function toggleCantReasonBox() {
            const box = document.getElementById('cantReasonBox');
            box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
        }

        async function submitResponse(statusValue) {
            const userName = document.getElementById('userName').value.trim();
            const session = document.getElementById('sessionSelect').value;
            const reason = document.getElementById('cantReason').value.trim();
            const rating = document.getElementById('userRating').value;
            const comment = document.getElementById('userComment').value.trim();
            const alertBox = document.getElementById('statusAlert');

            if (!userName || userName.toLowerCase() === "undefined" || userName.toLowerCase() === "null") {
                alertBox.className = "status-msg status-error";
                alertBox.innerText = "Please enter your full name before submitting.";
                alertBox.style.display = "block";
                return;
            }

            if (statusValue === "Can't Attend" && !reason) {
                alertBox.className = "status-msg status-error";
                alertBox.innerText = "Please enter your reason for missing the session.";
                alertBox.style.display = "block";
                return;
            }

            alertBox.className = "status-msg";
            alertBox.style.background = "#EBF2FA";
            alertBox.style.color = "#183B70";
            alertBox.innerText = "Submitting response...";
            alertBox.style.display = "block";

            const payload = {
                user: userName,
                session: session,
                status: statusValue,
                reason: statusValue === "Can't Attend" ? reason : "",
                rating: rating,
                comment: comment
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                alertBox.className = "status-msg status-success";
                alertBox.innerText = `✅ Thank you ${userName}! Recorded: "${statusValue}"`;
                document.getElementById('cantReasonBox').style.display = 'none';

                if (window.Telegram && window.Telegram.WebApp) {
                    setTimeout(() => window.Telegram.WebApp.close(), 1500);
                }
            } catch (err) {
                alertBox.className = "status-msg status-error";
                alertBox.innerText = "Submission error. Check network connection.";
            }
        }
    </script>
</body>
</html>
