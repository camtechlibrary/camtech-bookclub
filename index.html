<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamTech Book Club - Member RSVP</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --camtech-navy: #183B70;
            --camtech-navy-hover: #234E8C;
            --camtech-light-blue: #EBF2FA;
            --camtech-accent-blue: #C0D6F0;
            --bg-sand: #F5F1EA;
            --card-bg: #FFFFFF;
            --text-dark: #2C3E50;
            --text-muted: #70685C;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--bg-sand); 
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid #EAE3D9;
            overflow: hidden;
        }

        /* BRAND HEADER */
        .brand-header {
            background: var(--camtech-navy);
            color: #FFFFFF;
            padding: 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            height: 40px;
            width: auto;
            object-fit: contain;
            background: #FFFFFF;
            padding: 4px 10px;
            border-radius: 8px;
        }

        .brand-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--camtech-accent-blue);
            text-transform: uppercase;
        }

        .page-heading {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            color: #FFFFFF;
        }

        /* CONTENT FORM AREA */
        .form-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #DCD4C8;
            font-size: 13px;
            color: var(--text-dark);
            outline: none;
            background: #FAF7F2;
            transition: border-color 0.2s ease;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: var(--camtech-navy);
            background: #FFFFFF;
        }

        /* SESSION INFO CARD */
        .session-info-card {
            background: var(--camtech-light-blue);
            border: 1px solid var(--camtech-accent-blue);
            border-radius: 12px;
            padding: 14px;
        }

        .session-book-title {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--camtech-navy);
            margin-bottom: 2px;
        }

        .session-book-author {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .session-meta-row {
            font-size: 12px;
            color: var(--camtech-navy);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            font-weight: 500;
        }

        /* ACTION BUTTONS */
        .vote-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 6px;
        }

        .btn-vote {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: transform 0.1s ease, background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-vote:active { transform: scale(0.98); }

        .btn-attend {
            background: var(--camtech-navy);
            color: #FFFFFF;
        }
        .btn-attend:hover { background: var(--camtech-navy-hover); }

        .btn-cant {
            background: #FFEBEE;
            color: #C62828;
            border: 1px solid #FFCDD2;
        }
        .btn-cant:hover { background: #FFCDD2; }

        .btn-unsure {
            background: #FFFDE7;
            color: #F57F17;
            border: 1px solid #FFF59D;
        }
        .btn-unsure:hover { background: #FFF59D; }

        /* CONDITIONAL REASON & FEEDBACK SECTIONS */
        .conditional-box {
            display: none;
            flex-direction: column;
            gap: 10px;
            background: #FAF7F2;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #EAE3D9;
        }

        .status-msg {
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
            display: none;
            font-weight: 600;
        }
        .status-success { background: #E8F5E9; color: #2E7D32; border: 1px solid #A5D6A7; }
        .status-error { background: #FFEBEE; color: #C62828; border: 1px solid #FFCDD2; }

        .footer-credit {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            padding: 12px 20px 16px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <div class="brand-header">
            <img src="camtech_logo.png" alt="CamTech Logo" class="header-logo" onerror="this.style.display='none'">
            <div class="brand-title">CamTech Library Book Club</div>
            <div class="page-heading">Weekly Reading & Discussion</div>
        </div>

        <!-- FORM CONTENT -->
        <div class="form-content">
            
            <div class="form-group">
                <label class="form-label" for="userName">Your Full Name</label>
                <input type="text" id="userName" class="form-input" placeholder="e.g. Sokha Chan" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="sessionSelect">Select Session</label>
                <select id="sessionSelect" class="form-select" onchange="onSessionSelectChange()">
                    <option value="Session 11">Session 11</option>
                </select>
            </div>

            <!-- DYNAMIC BOOK DISPLAY -->
            <div class="session-info-card">
                <div class="session-book-title" id="bookTitle">"The Library of Babel & Other Stories"</div>
                <div class="session-book-author" id="bookAuthor">by Jorge Luis Borges</div>
                <div class="session-meta-row">🕒 <span id="sessionTime">3:30 PM - 5:00 PM</span></div>
                <div class="session-meta-row">📍 <span id="sessionLocation">CamTech University, lobby</span></div>
            </div>

            <label class="form-label">Will you join us?</label>
            
            <div class="vote-options">
                <button type="button" class="btn-vote btn-attend" onclick="submitResponse('I\'ll Attend')">
                    ✅ I'll Attend
                </button>
                <button type="button" class="btn-vote btn-cant" onclick="showCantReasonBox()">
                    ❌ Can't Attend
                </button>
                <button type="button" class="btn-vote btn-unsure" onclick="submitResponse('Not Sure Yet')">
                    🤔 Not Sure Yet
                </button>
            </div>

            <!-- UNABLE TO ATTEND REASON FIELD -->
            <div class="conditional-box" id="cantReasonBox">
                <label class="form-label" for="cantReason">Reason for missing session:</label>
                <input type="text" id="cantReason" class="form-input" placeholder="e.g. Class conflict, traveling...">
                <button type="button" class="btn-vote btn-cant" onclick="submitResponse('Can\'t Attend')">
                    Confirm Submission
                </button>
            </div>

            <!-- OPTIONAL FEEDBACK & RATING -->
            <div class="conditional-box" id="feedbackBox" style="display: flex;">
                <label class="form-label">Optional Feedback / Rating</label>
                <select id="userRating" class="form-select">
                    <option value="">Rate past session (Optional)</option>
                    <option value="5 ⭐">5 ⭐ - Excellent</option>
                    <option value="4 ⭐">4 ⭐ - Very Good</option>
                    <option value="3 ⭐">3 ⭐ - Good</option>
                    <option value="2 ⭐">2 ⭐ - Average</option>
                    <option value="1 ⭐">1 ⭐ - Needs Improvement</option>
                </select>
                <input type="text" id="userComment" class="form-input" placeholder="Comments or book recommendations...">
            </div>

            <div id="statusAlert" class="status-msg"></div>

        </div>

        <div class="footer-credit">
            CamTech University • Library Services Console
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2nvLYa1kNGijsg_XEqfW1lSdtsTUnOfBDrTkjL6GbyDsmPgKF2dI40rVu9ujQ9Xym/exec";

        let sessionDetailsMap = JSON.parse(localStorage.getItem('camtech_session_details')) || {
            "Session 11": {
                title: '"The Library of Babel & Other Stories"',
                author: "by Jorge Luis Borges",
                time: "3:30 PM - 5:00 PM",
                location: "CamTech University, lobby"
            }
        };

        // Initialize Telegram WebApp API if available
        window.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    const u = tg.initDataUnsafe.user;
                    const fullName = `${u.first_name || ''} ${u.last_name || ''}`.trim();
                    if (fullName) {
                        document.getElementById('userName').value = fullName;
                    }
                }
            }
            loadSessionsFromBackend();
        });

        async function loadSessionsFromBackend() {
            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();
                
                const sessions = new Set(Object.keys(sessionDetailsMap));
                data.forEach(item => {
                    if (item.session) {
                        const cleanSess = item.session.split(" (")[0].trim();
                        sessions.add(cleanSess);
                    }
                });

                const select = document.getElementById('sessionSelect');
                select.innerHTML = '';
                Array.from(sessions).reverse().forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.innerText = s;
                    select.appendChild(opt);
                });

                onSessionSelectChange();
            } catch (err) {
                console.log("Using cached/default session details.");
                onSessionSelectChange();
            }
        }

        function onSessionSelectChange() {
            const selected = document.getElementById('sessionSelect').value;
            const details = sessionDetailsMap[selected];

            if (details) {
                document.getElementById('bookTitle').innerText = details.title;
                document.getElementById('bookAuthor').innerText = details.author;
                document.getElementById('sessionTime').innerText = details.time;
                document.getElementById('sessionLocation').innerText = details.location;
            } else {
                document.getElementById('bookTitle').innerText = '"The Library of Babel & Other Stories"';
                document.getElementById('bookAuthor').innerText = 'by Jorge Luis Borges';
                document.getElementById('sessionTime').innerText = '3:30 PM - 5:00 PM';
                document.getElementById('sessionLocation').innerText = 'CamTech University, lobby';
            }
        }

        function showCantReasonBox() {
            const box = document.getElementById('cantReasonBox');
            box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
        }

        async function submitResponse(statusValue) {
            const userName = document.getElementById('userName').value.trim();
            const session = document.getElementById('sessionSelect').value;
            const reasonInput = document.getElementById('cantReason').value.trim();
            const rating = document.getElementById('userRating').value;
            const comment = document.getElementById('userComment').value.trim();
            const alertBox = document.getElementById('statusAlert');

            if (!userName) {
                alertBox.className = "status-msg status-error";
                alertBox.innerText = "Please enter your full name before submitting.";
                alertBox.style.display = "block";
                return;
            }

            if (statusValue.toLowerCase().includes("can't") && !reasonInput) {
                alertBox.className = "status-msg status-error";
                alertBox.innerText = "Please state your reason for missing the session.";
                alertBox.style.display = "block";
                return;
            }

            alertBox.className = "status-msg";
            alertBox.style.background = "#EBF2FA";
            alertBox.style.color = "#183B70";
            alertBox.innerText = "Submitting your response...";
            alertBox.style.display = "block";

            const payload = {
                user: userName,
                participant: userName,
                name: userName,
                session: session,
                status: statusValue,
                response: statusValue,
                reason: reasonInput,
                cantReason: reasonInput,
                cant_reason: reasonInput,
                "Can't Join Reason": reasonInput,
                rating: rating,
                comment: comment
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                alertBox.className = "status-msg status-success";
                alertBox.innerText = `✅ Thank you, ${userName}! Your RSVP (${statusValue}) has been recorded.`;
                document.getElementById('cantReasonBox').style.display = 'none';

                if (window.Telegram && window.Telegram.WebApp) {
                    setTimeout(() => {
                        window.Telegram.WebApp.close();
                    }, 2000);
                }
            } catch (err) {
                alertBox.className = "status-msg status-error";
                alertBox.innerText = "Submission error. Please check your connection and try again.";
            }
        }
    </script>
</body>
</html>
